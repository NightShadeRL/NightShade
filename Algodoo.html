<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Level Downloads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0b; --panel:#131316; --panel2:#1a1a1e; --line:#26262b; --line2:#3a3a42;
  --text:#f2f2f3; --muted:#8b8b93; --dim:#6c6c75;
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.55 var(--sans)}
main{max-width:680px;margin:0 auto;padding:72px 20px 96px}
header{text-align:center;margin-bottom:44px}
h1{font-size:clamp(2.6rem,9vw,3.8rem);font-weight:700;letter-spacing:-.04em;line-height:1;margin:0 0 22px}
.sub{color:var(--muted);max-width:440px;margin:0 auto;font-size:1.02rem}
.sub b{color:#c4c4cb;font-weight:600}

.bar{display:flex;gap:10px}
.bar input{flex:1;min-width:0;padding:13px 16px;font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;outline:none}
.bar input::placeholder{color:var(--dim)}
.bar input:focus{border-color:var(--line2);box-shadow:0 0 0 3px rgba(255,255,255,.07)}
.go{padding:0 22px;font:600 .95rem var(--sans);color:#0a0a0b;background:#fff;border:0;border-radius:10px;cursor:pointer}
.go:hover{background:#e4e4e7}
.go:focus-visible,.chip:focus-visible,.dl:focus-visible,.head:focus-visible{outline:2px solid #fff;outline-offset:2px}

.try{margin:14px 0 0}
.try small{display:block;color:var(--muted);font-size:.72rem;margin-bottom:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:400 .82rem var(--mono);color:#d4d4d9;background:var(--panel2);border:1px solid transparent;border-radius:7px;padding:7px 12px;cursor:pointer}
.chip:hover,.chip.on{border-color:var(--line2);background:#212126}

h2{text-align:center;font-size:.95rem;font-weight:600;margin:52px 0 20px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.lvl{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.lvl.open{border-color:var(--line2)}
.head{all:unset;box-sizing:border-box;display:block;width:100%;padding:16px 18px;cursor:pointer;position:relative;border-radius:10px}
.head:hover .name{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line2)}
.name{font-weight:600;font-size:.95rem;display:block;padding-right:24px}
.path{display:block;font:400 .78rem var(--mono);color:var(--dim);margin:3px 0 7px}
.blurb{display:block;color:var(--muted);font-size:.82rem}
.chev{position:absolute;right:18px;top:20px;width:8px;height:8px;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);transform:rotate(45deg);transition:transform .25s}
.open .chev{transform:rotate(225deg)}

.drop{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.open .drop{grid-template-rows:1fr}
.inner{overflow:hidden;min-height:0}
.body{display:flex;gap:18px;flex-wrap:wrap;padding:6px 18px 18px;border-top:1px solid var(--line);margin-top:0;padding-top:18px}
.thumb{flex:0 0 240px;max-width:100%;aspect-ratio:16/9;background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:grid;place-items:center;color:var(--dim);font-size:.8rem}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.info{flex:1 1 220px;min-width:0}
dl{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;margin:0 0 14px;font-size:.85rem}
dt{color:var(--dim)} dd{margin:0;font-family:var(--mono);font-size:.8rem;color:#d4d4d9}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tag{font:400 .74rem var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.dl{display:inline-block;padding:9px 18px;border-radius:8px;background:#fff;color:#0a0a0b;font-weight:600;font-size:.88rem;text-decoration:none}
.dl:hover{background:#e4e4e7}
.empty{text-align:center;color:var(--muted);padding:36px 0}
@media (prefers-reduced-motion:reduce){.drop,.chev{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Levels</h1>
    <p class="sub">Direct downloads for every level I've made. Pick one to see a <b>preview</b> and grab the file.</p>
  </header>

  <form class="bar" id="form" role="search">
    <input id="q" type="search" placeholder="Search levels, authors, or tags" aria-label="Search levels" autocomplete="off">
    <button class="go" type="submit">Go</button>
  </form>
  <div class="try"><small>Browse by tag</small><div class="chips" id="chips"></div></div>

  <h2 id="count" aria-live="polite">All levels</h2>
  <ul id="list"></ul>
  <div class="empty" id="empty" hidden>No levels match that search. Try a different name or tag.</div>
</main>

<script>
const LEVELS = [
  {
    name: "EMR - Shade Revamp",
    author: "NightShade",
    file: "levels/EMR - Shade Revamp.phz",
    preview: "previews/EMRPreview.png",
    description: "A Revamp of the original level made by Elliott.",
    tags: ["Qualifier", "Fix", "Medium length"],
    details: { Version: "4.3", Size: "13.4 MB", Updated: "2026-09-28" }
  },
  {
    name: "The Jumble",
    author: "NightShade",
    file: "levels/The Jumble.phz",
    preview: "previews/JumblePreview.png",
    description: "A Jubmle of things to make the race interesting.",
    tags: ["Standard", "Fix", "Medium to Long length"],
    details: { Version: "4.3", Size: "13.1 MB", Updated: "2026-10-01" }
  }
];

const $ = id => document.getElementById(id);
const list = $("list"), q = $("q"), chips = $("chips");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function render(items){
  list.innerHTML = items.map((l, i) => `
    <li class="lvl">
      <button class="head" aria-expanded="false" aria-controls="p${i}">
        <span class="name">${esc(l.name)}</span>
        <span class="path">${esc(l.author || "")}${l.details && l.details.Size ? " / " + esc(l.details.Size) : ""}</span>
        <span class="blurb">${esc(l.description || "")}</span>
        <span class="chev" aria-hidden="true"></span>
      </button>
      <div class="drop" id="p${i}"><div class="inner"><div class="body">
        <div class="thumb"><img data-src="${esc(l.preview || "")}" alt="Preview of ${esc(l.name)}"></div>
        <div class="info">
          ${l.details ? `<dl>${Object.entries(l.details).map(([k,v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : ""}
          ${l.tags && l.tags.length ? `<div class="tags">${l.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
          <a class="dl" href="${esc(l.file)}" download>Download</a>
        </div>
      </div></div></div>
    </li>`).join("");
  $("count").textContent = q.value.trim() ? items.length + (items.length === 1 ? " result" : " results") : "All levels";
  $("empty").hidden = items.length > 0;
}

list.addEventListener("click", e => {
  const btn = e.target.closest(".head");
  if (!btn) return;
  const li = btn.parentElement;
  const open = li.classList.toggle("open");
  btn.setAttribute("aria-expanded", open);
  const img = li.querySelector("img");
  if (open && img && !img.src && img.dataset.src) {
    img.onerror = () => { img.parentElement.textContent = "No preview yet"; };
    img.src = img.dataset.src;
  }
});

function filter(){
  const t = q.value.trim().toLowerCase();
  chips.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.textContent.toLowerCase() === t));
  render(!t ? LEVELS : LEVELS.filter(l =>
    [l.name, l.author, l.description, ...(l.tags || [])].join(" ").toLowerCase().includes(t)));
}

const allTags = [...new Set(LEVELS.flatMap(l => l.tags || []))];
chips.innerHTML = allTags.map(t => `<button type="button" class="chip">${esc(t)}</button>`).join("");
chips.addEventListener("click", e => {
  const c = e.target.closest(".chip");
  if (!c) return;
  q.value = q.value.trim().toLowerCase() === c.textContent.toLowerCase() ? "" : c.textContent;
  filter();
});

q.addEventListener("input", filter);
$("form").addEventListener("submit", e => { e.preventDefault(); filter(); });
render(LEVELS);
</script>
</body>
</html>
