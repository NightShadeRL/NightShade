<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0b; --panel:#131316; --panel2:#1a1a1e; --line:#26262b; --line2:#3a3a42;
  --text:#f2f2f3; --muted:#8b8b93; --dim:#6c6c75;
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.55 var(--sans)}
main{max-width:680px;margin:0 auto;padding:72px 25px 80px}
header{text-align:center;margin-bottom:48px}
h1{font-size:clamp(2.6rem,9vw,3.8rem);font-weight:700;letter-spacing:-.04em;line-height:1;margin:0 0 22px}
.sub{color:var(--muted);max-width:440px;margin:0 auto;font-size:1.02rem}
.sub b{color:#c4c4cb;font-weight:600}
h2{text-align:center;font-size:.95rem;font-weight:600;margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{display:block;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:inherit;text-decoration:none;transition:border-color .2s,background .2s}
.card:hover{border-color:var(--line2);background:var(--panel2)}
.card:focus-visible{outline:2px solid #fff;outline-offset:2px}
.card .name{font-weight:600;font-size:.95rem;display:block}
.card .url{display:block;font:400 .78rem var(--mono);color:var(--dim);margin:3px 0 9px;overflow-wrap:anywhere}
.card .desc{display:block;color:var(--muted);font-size:.82rem}
.card .go{display:inline-block;margin-top:14px;font-size:.82rem;font-weight:600;color:#fff}
.card:hover .go{text-decoration:underline;text-underline-offset:3px}
.soon{opacity:.55;pointer-events:none}
footer{text-align:center;margin-top:56px;color:var(--dim);font-size:.82rem}
footer a{color:var(--muted);text-underline-offset:3px}
footer a:hover{color:var(--text)}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<main>
  <header>
    <h1>NightShade Projects</h1>
    <p class="sub">Direct downloads for the things I make. Pick a Project Page to <b>browse and download</b>.</p>
  </header>

  <h2>All projects</h2>
  <div class="grid" id="grid"></div>

  <footer id="foot"></footer>
</main>

<script>

const PROJECTS = [
  {
    name: "Algodoo Levels",
    url: "Algodoo.html",
    description: "Every level I've made, with previews and direct downloads for Elliott's Marble race(s).",
    label: "Browse levels"
  },
  {
    name: "Mod Downloads",
    url: "#",
    description: "Mods and add-ons for games I wish to play around with.",
    label: "Browse mods",
    soon: true
  },
  {
    name: "Texture Packs",
    url: "#",
    description: "Texture(s) for games that I play and wish to alter.",
    label: "Browse packs",
    soon: true
  },
  {
    name: "Tools",
    url: "#",
    description: "This page will mostly be accessable to only me, may be available later.",
    label: "Coming soon",
    soon: true
  },
  {
    name: "Minecraft Worlds",
    url: "#",
    description: "Worlds I've made for Minecraft, ready to download and explore.",
    label: "Coming soon",
    soon: true
  }
];

const FOOTER = { text: "Made by NightShade", link: "https://github.com/NightShadeRL", linkText: "GitHub" };

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shown = u => u.replace(/^https?:\/\//, "").replace(/\/$/, "");

document.getElementById("grid").innerHTML = PROJECTS.map(p => `
  <a class="card${p.soon ? " soon" : ""}" href="${esc(p.url)}"${p.soon ? ' aria-disabled="true" tabindex="-1"' : ""}>
    <span class="name">${esc(p.name)}</span>
    <span class="url">${esc(p.soon ? "in progress" : shown(p.url))}</span>
    <span class="desc">${esc(p.description)}</span>
    <span class="go">${esc(p.label || "Open")}</span>
  </a>`).join("");

document.getElementById("foot").innerHTML =
  `${esc(FOOTER.text)} &middot; <a href="${esc(FOOTER.link)}">${esc(FOOTER.linkText)}</a>`;
</script>
</body>
</html>
